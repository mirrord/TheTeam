# Tool Configuration for pithos Agent Tool Calling

# Enable or disable tool calling system
enabled: true

# Maximum execution time for any tool (seconds)
timeout: 30

# Maximum size of captured output (bytes)
max_output_size: 10000

# Filtering mode: 'strict', 'standard', or 'permissive'
# - 'strict':     Only tools in the include list are allowed.
#                 Tools in the confirm group require user approval before running.
# - 'standard':   All discovered tools are allowed except those in the exclude list.
#                 Tools in the confirm group require user approval before running.
# - 'permissive': All discovered tools are allowed except those in the exclude list.
#                 Tools in the confirm group are auto-approved (no user prompt).
mode: strict

# List of tools to include (used when mode is 'include')
include:
  # --- Flowcharts (virtual tool) ---
  - flowchart
  # --- Web research (virtual tool) ---
  - web-research
  # --- News research (virtual tool) ---
  - research-news
  # --- Craft analysis (virtual tool) ---
  - craft-notes
  # --- Text-to-image (virtual tool) ---
  - prompt2image

# List of tools that require interactive user confirmation before execution.
# In 'strict' and 'standard' modes the user must approve each call before it runs.
# In 'permissive' mode these tools are auto-approved (no prompt shown).
# If denied, the agent receives "Denied by user." as the tool result.
# Example: uncomment the line below to require confirmation for shell access.
# confirm:
#   - bash
#   - powershell
confirm:
  # --- Shell interpreters ---
  - powershell
  - pwsh
  - cmd
  - bash
  - sh
  - wsl

# List of tools to exclude (used when mode is 'exclude' or 'all')
# These are dangerous commands that should never be allowed
exclude:
 # --- Python ---
  - python
  - python3
  - pip
  - pip3
  # --- Name collision with the prompt2image virtual tool ---
  # Tesseract-OCR's training tools ship a real `prompt2image` binary (renders
  # OCR training images using Pango/Fontconfig). Exclude it explicitly so it
  # is never discovered as a CLI tool, even in 'standard'/'permissive' mode.
  - prompt2image
  # --- Network ---
  - curl
  - wget
  - ssh
  - scp
  - ping
  - nslookup
  - tracert
  - traceroute
  - netstat
  - ipconfig
  - ifconfig
  # --- File & text utilities ---
  - echo
  - cat
  - type
  - more
  - less
  - head
  - tail
  - ls
  - dir
  - pwd
  - cd
  - grep
  - find
  - which
  - where
  - sort
  - wc
  - awk
  - sed
  - tr
  - diff
  - tree
  - touch
  - cp
  - copy
  - mv
  - move
  - mkdir
  # --- Archive ---
  - tar
  - zip
  - unzip
  # --- System info ---
  - env
  - set
  - whoami
  - hostname
  - date
  - uname
  # --- ^^ taken from the default allowlist in pithos, but removed for safety. ---
  - rm
  - rmdir
  - del
  - erase
  - format
  - shutdown
  - reboot
  - poweroff
  - init
  - kill
  - killall
  - pkill
  - dd
  - mkfs
  - fdisk
  # --- Node.js ---
  - node
  - npm
  - npx
  # --- Version control ---
  - git

# Flowchart tool configuration
# Allows agents to run registered flowcharts as tools
flowcharts:
  enabled: true
  # Maximum execution time for flowchart tools (seconds)
  timeout: 120
  # Maximum steps per flowchart execution
  max_steps: 100
  # Per-flowchart enable/disable overrides.
  # Flowcharts NOT listed here default to enabled.
  # Set enabled: false to hide a specific flowchart from agents.
  # Example:
  #   items:
  #     multi_agent_research:
  #       enabled: false
  #     simple_reflect:
  #       enabled: true   # explicit but redundant; true is the default
  items: {}

# Web research virtual tool configuration
# When enabled, the agent can invoke `web-research <inquiry>` to spin up the
# subagent-driven crawler. Full settings live in web_research_config.yaml.
web_research:
  enabled: true

# News research virtual tool configuration
# When enabled, the agent can invoke `research-news <inquiry>` to collect and
# summarise recent articles from whitelisted domains/feeds. Full settings live
# in news_research_config.yaml.
news_research:
  enabled: true

# Craft analysis virtual tool configuration
# When enabled, the agent can invoke `craft-notes <file path or raw text>` to
# analyze a story's creative-writing craft and produce prescriptive how-to
# notes. Full settings live in craft_analysis_config.yaml.
craft_analysis:
  enabled: true

# Text-to-image virtual tool configuration
# When enabled, the agent can invoke `prompt2image <prompt>` to render an image
# with a local model. Full settings live in prompt2image_config.yaml.
# Disabled by default because the diffusers backend pulls in heavy deps
# (torch); enable after configuring a backend.
# Note: the agent-facing tool name is `prompt2image`, not `prompt2image` — the
# latter collides with the real `prompt2image` binary from Tesseract's OCR
# training tools, which some systems have on PATH (see `exclude` below).
prompt2image:
  enabled: false

