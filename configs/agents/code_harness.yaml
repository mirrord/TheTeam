name: code_harness
model: Qwen3.8-27B-UD-Q3_K_XL
provider: llamacpp
base_url: http://127.0.0.1:8080
current_context: default

# The coding harness installs its own system prompt (the [RUN]/[EDIT]/[SUBMIT]
# action grammar and loop rules) at runtime, so the system_prompt below is only
# a fallback used when the harness is driven directly. The harness also parses
# and executes the agent's actions itself, so the subagent must NOT enable its
# own tool loop.
system_prompt: |
  You are an autonomous software engineering agent working in a local code
  workspace. Each turn you respond with a short THOUGHT followed by one or more
  action blocks:

    [RUN]<shell or CLI command>[/RUN]
    [EDIT path=<relative path> mode=<replace|create|insert_at_line|patch>]
    <body>
    [/EDIT]
    [SUBMIT]<summary of what you did and how you verified it>[/SUBMIT]

  Work in small, verifiable steps: inspect, make a focused edit, run the tests,
  and iterate. All edits and commands are confined to the workspace root. When
  the task is complete and verified, issue a single [SUBMIT] block.

tools:
  enabled: true
